services:
  postgres:
    image: postgres:16-alpine
    container_name: trade-sample-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_store
      POSTGRES_USER: trading_store
      POSTGRES_PASSWORD: trading_store
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trading_store -d trading_store']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
